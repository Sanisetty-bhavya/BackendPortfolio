<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#000000"/>

  <!-- Large window -->
  <rect x="10" y="10" width="44" height="34" rx="4" fill="none" stroke="#d1d5db" stroke-width="2"/>
  <!-- Top bar of large window -->
  <line x1="10" y1="16" x2="54" y2="16" stroke="#d1d5db" stroke-width="2"/>
  <!-- Code lines in large window -->
  <line x1="16" y1="22" x2="40" y2="22" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="28" x2="36" y2="28" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="34" x2="44" y2="34" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="40" x2="32" y2="40" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>

  <!-- Small window in front -->
  <rect x="14" y="30" width="24" height="20" rx="3" fill="none" stroke="#d1d5db" stroke-width="2"/>
  <!-- Top bar of small window -->
  <line x1="14" y1="35" x2="38" y2="35" stroke="#d1d5db" stroke-width="2"/>

  <!-- </> symbol inside small window -->
  <polyline points="20,43 23,40 20,37" fill="none" stroke="#d1d5db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="32,37 29,40 32,43" fill="none" stroke="#d1d5db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="25" y1="44" x2="27" y2="36" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
</svg>

